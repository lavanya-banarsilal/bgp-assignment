!
hostname r2
!
! Disable RFC 8212 eBGP-requires-policy enforcement (same reason as r1).
! Without this, r2 would drop inbound routes from r1 in the absence of an
! explicit inbound policy — even though we only need to receive and inspect
! the route, not redistribute it.
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 3 10
 neighbor 10.0.0.1 timers connect 3
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
 exit-address-family
 !
 ! Accept crypto-routes from r1.
 ! Public key is loaded dynamically by the test (TEST 4).
 address-family ipv4 crypto-routes
  neighbor 10.0.0.1 activate
 exit-address-family
!
