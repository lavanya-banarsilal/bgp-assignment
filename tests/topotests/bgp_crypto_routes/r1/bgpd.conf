!
hostname r1
!
! Disable RFC 8212 eBGP-requires-policy enforcement.
! FRR >= 7.4 enables this by default, which causes subgroup_announce_check()
! to reject every outbound route for an eBGP peer that has no route-map/
! prefix-list configured.  For the crypto-routes test we want unrestricted
! advertisement so we turn the check off explicitly.
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 timers 3 10
 neighbor 10.0.0.2 timers connect 3
 !
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
 exit-address-family
 !
 ! Activate the crypto-routes address family toward r2.
 ! r1 originates 192.168.100.0/24 as a static crypto-routes network.
 address-family ipv4 crypto-routes
  neighbor 10.0.0.2 activate
  network 192.168.100.0/24
 exit-address-family
!
